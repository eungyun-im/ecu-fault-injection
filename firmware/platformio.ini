; Two builds of the same firmware.
;
;   test     fault injection routines included: the build the bench runs against
;   release  no fault injection routines
;
;   pio run -e test -t upload

[platformio]
default_envs = test

[env]
platform = ststm32
board = nucleo_g431rb
framework = stm32cube
build_flags = -Wall -Wextra

[env:test]
build_flags = ${env.build_flags} -DECU_FAULT_INJECTION=1

[env:release]
build_flags = ${env.build_flags} -DECU_FAULT_INJECTION=0
