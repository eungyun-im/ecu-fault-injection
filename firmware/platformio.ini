; Builds of the firmware.
;
; The application alone, at the start of flash. This is the set-up for the
; fault injection tests:
;
;   test         fault injection routines included
;   release      no fault injection routines
;
; With a bootloader, for the update tests:
;
;   bootloader   first 16 kB of flash, flashed once over the ST-LINK
;   app_v100     the application, version 1.0.0, linked for the application slot
;   app_v110     the same, version 1.1.0
;
; The two applications are not flashed with the ST-LINK. The bootloader
; installs them over CAN (python -m bench.updater).
;
;   pio run -e test -t upload
;   pio run -e bootloader -t upload
;   pio run -e app_v100 -e app_v110

[platformio]
default_envs = test

[env]
platform = ststm32
board = nucleo_g431rb
framework = stm32cube
build_flags = -Wall -Wextra
build_src_filter = +<main.c>

[env:test]
build_flags = ${env.build_flags} -DECU_FAULT_INJECTION=1

[env:release]
build_flags = ${env.build_flags} -DECU_FAULT_INJECTION=0

[env:bootloader]
build_src_filter = +<boot_main.c>
board_build.ldscript = ld/bootloader.ld
build_flags = ${env.build_flags} -DBOOT_TEST_BUILD=1 -Wl,-L${PROJECT_DIR}/ld

[env:app_v100]
board_build.ldscript = ld/application.ld
build_flags = ${env.build_flags} -DECU_FAULT_INJECTION=1 -DECU_BOOTLOADER=1 -DSW_VERSION_MINOR=0 -Wl,-L${PROJECT_DIR}/ld

[env:app_v110]
board_build.ldscript = ld/application.ld
build_flags = ${env.build_flags} -DECU_FAULT_INJECTION=1 -DECU_BOOTLOADER=1 -DSW_VERSION_MINOR=1 -Wl,-L${PROJECT_DIR}/ld
